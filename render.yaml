services:
  - type: web
    name: diplomado-ia-backend
    runtime: node
    plan: free
    rootDir: backend
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/ia/estado
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_CLIENT
        value: sqlite
      - key: DATABASE_FILENAME
        value: .tmp/data.db
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: IA_API_KEY
        sync: false
      - key: IA_DEFAULT_PROVIDER
        value: auto
      - key: IA_DEFAULT_MODEL
        sync: false
      - key: IA_MODEL_OPENROUTER
        value: openrouter/free
      - key: IA_FALLBACK_CHAIN
        value: openrouter:openrouter/free,groq:openai/gpt-oss-120b
      - key: FRONTEND_URL
        sync: false
      - key: IA_DAILY_LIMIT
        value: 30
      - key: IA_GLOBAL_DAILY_LIMIT
        value: 300
      - key: IA_USAGE_FILE
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: PROXY
        value: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_SITE_NAME
        value: diplomado_ia
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENCODE_API_KEY
        sync: false
